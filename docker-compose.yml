services:
  caldav-automata:
    build: .
    # No ports — the daemon connects outward to CalDAV servers; nothing listens here.
    volumes:
      - caldav-state:/data          # persists state.json across restarts
      - ./rules:/rules:ro           # LISP rule files (hot-reloaded every cycle)
      - ./config:/config:ro         # calendars.yml configuration
    environment:
      CONFIG_FILE: "/config/calendars.yml"
      LOG_LEVEL: "info"
      # Secrets: set these in a .env file or in your container platform's secret store.
      ICLOUD_PASSWORD: "${ICLOUD_PASSWORD}"
    restart: unless-stopped

volumes:
  caldav-state:
