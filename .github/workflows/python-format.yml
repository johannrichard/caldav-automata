name: Python format

on:
    pull_request:
    push:
        branches:
            - "**"

jobs:
    black:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install formatter
              run: |
                  python -m pip install --upgrade pip
                  pip install black

            - name: Check formatting
              run: |
                  black --check .
