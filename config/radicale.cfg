[server]
hosts = 127.0.0.1:5233
max_connections = 64
ssl = False

[auth]
# No authentication by default — anyone on the network can read/write.
# To enable password authentication, switch to the htpasswd type and provide
# the path to an htpasswd file generated with:
#
#   htpasswd -B /path/to/htpasswd <username>
#
# or with Python (no extra tools required):
#
#   python3 -c "import bcrypt, getpass; pw=getpass.getpass(); \
#     print('user:' + bcrypt.hashpw(pw.encode(), bcrypt.gensalt()).decode())" \
#     >> /etc/radicale/htpasswd
#
# type = htpasswd
# htpasswd_filename = /etc/radicale/htpasswd
# htpasswd_encryption = bcrypt

type = none

[storage]
filesystem_folder = /data/collections

[logging]
level = warning
