# CalDAV Automata — configuration file
# ------------------------------------
# poll_interval  : seconds between poll cycles (default: 30)
# rules_dir      : directory that contains *.lisp rule files (hot-reloaded)
# state_folder   : directory where SQLite state DB is stored

poll_interval: 30
rules_dir: /rules
state_folder: /data

accounts:
  # ── iCloud (Apple Calendar) ──────────────────────────────────────────
  #
  # Use the generic base URL below. The caldav library automatically
  # discovers your user-specific principal and calendar-home-set via
  # PROPFIND — no need to hard-code a personal path.
  #
  # You MUST use an App-Specific Password (not your Apple ID password).
  # Create one at https://appleid.apple.com/account/manage and prefer
  # mounting it as a secret file so it never appears in this file or in
  # the container environment.
  - name: "iCloud"
    url: "https://caldav.icloud.com/"
    username: "you@icloud.com"
    password_file: "${ICLOUD_PASSWORD_FILE}"
    # Optional fallback-only organizer. Used only if principal
    # calendar-user-address-set discovery fails.
    organizer: "you@icloud.com"
    # Or fall back to an environment variable:
    # password: "${ICLOUD_PASSWORD}"
    # List specific calendar display-names to watch, or use ["*"] for all.
    calendars:
      - "Family"
      - "Work"
    # Optional connection knobs (rarely needed for iCloud but available):
    #
    # ssl_verify_cert: true          # set to false only for self-signed certs
    # auth_type: "basic"             # force Basic auth (iCloud default)
    # headers:                       # extra HTTP headers sent with every request
    #   User-Agent: "CalDAV-Automata/1.0"

  # ── Generic CalDAV server (e.g. Nextcloud, Baikal, Radicale) ─────────
  # - name: "Nextcloud"
  #   url: "https://nextcloud.example.com/remote.php/dav/"
  #   username: "alice"
  #   password_file: "/run/secrets/nextcloud_password"
  #   # Or:
  #   # password: "${NEXTCLOUD_PASSWORD}"
  #   calendars:
  #     - "*"            # watch every calendar on this account

# ── ICS feeds (read-only) ─────────────────────────────────────────────────
#
# ICS feeds are public or shared calendars published as .ics files over HTTP
# or HTTPS.  No credentials are required — just a URL.
#
# The daemon polls each feed on the same interval as CalDAV accounts and
# applies your LISP rules to every new event it encounters.  Because ICS feeds
# are read-only, actions that modify the event (add-attendee, set-alert, …)
# have no effect on the source, but copy-to-calendar still works: it writes the
# event into any writable CalDAV calendar on any of the configured accounts.
#
# Calendar name — used to match (calendar "…") clauses in your rules — is
# taken from the X-WR-CALNAME property inside the ICS file when present.  The
# name: field below is used as a fallback when that property is absent.  If
# neither is available the URL itself is used as the name.
#
# ics_feeds:
#   - url: "https://calendar.google.com/calendar/ical/hello%40summerofprotocols.com/public/basic.ics"
#     name: "Summer of Protocols"   # optional — overridden by X-WR-CALNAME if present
#
#   - url: "https://example.com/team-events.ics"
#     # name is optional; omit it and the daemon will use X-WR-CALNAME or the URL
