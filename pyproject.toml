[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caldav-automata"
version = "0.12.1"
description = "CalDAV polling daemon with a LISP rule engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["caldav>=1.3.9", "icalendar>=5.0.0", "PyYAML>=6.0"]

[project.scripts]
caldav-automata = "caldav_automata.main:main"






[tool.setuptools.packages.find]
include = ["caldav_automata*"]

[tool.setuptools]
include-package-data = true

[tool.semantic_release]
branch = "master"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
upload_to_vcs_release = true
upload_to_repository = false
build_command = "echo 'Skipping package build'"

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "build"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | \.agents
  | build
  | dist
)/
'''
